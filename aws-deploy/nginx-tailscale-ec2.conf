# ==============================================================================
# Albedrozes Autonomous Rover - Nginx Reverse Proxy for AWS EC2 + Tailscale
# Place this at /etc/nginx/sites-available/albedrozes on your AWS EC2 instance
# ==============================================================================

# REPLACE 100.x.y.z WITH YOUR RASPBERRY PI TAILSCALE IP:
# (Run `tailscale ip -4` on the Raspberry Pi to find this IP)
upstream raspberry_pi_backend {
    server 100.126.160.71:8000; # Example Tailscale IP:port of the Pi
    keepalive 32;
}

server {
    listen 80;
    server_name _; # Or your domain like rover.albedrozes.com

    # 1. Serve Built Frontend Static Files
    root /home/ubuntu/albedrozes/frontend/dist;
    index index.html;

    # Handle React Router SPA page refreshes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy REST API Requests to Raspberry Pi over Tailscale
    location /api/ {
        proxy_pass http://raspberry_pi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy Rover Activation / Deactivation
    location ~ ^/(activate|deactivate|status)$ {
        proxy_pass http://raspberry_pi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Proxy Live MJPEG Camera Stream with chunked transfer & zero buffering
    location /camera {
        proxy_pass http://raspberry_pi_backend/camera;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable buffering so the live camera stream is real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }
}
